server {
    listen 80;
    server_name gestaofinanceira.codermaster.com.br;
    return 301 https://;
}

server {
    listen 443 ssl http2;
    server_name gestaofinanceira.codermaster.com.br;

    ssl_certificate /etc/letsencrypt/live/gestaofinanceira.codermaster.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestaofinanceira.codermaster.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade ;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
        proxy_cache_bypass ;
    }

    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
    }
}
